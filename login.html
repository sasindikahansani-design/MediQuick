 <!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Welcome Back - MediQuick Pharmacy
    </title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#eefaff;
            color:#17324d;
        }

        /* NAVBAR */

        .navbar{
            background:white;
            padding:18px 6%;
            display:flex;
            align-items:center;
            justify-content:space-between;
            box-shadow:0 2px 12px rgba(0,0,0,0.08);
        }

        .logo{
            font-size:25px;
            font-weight:bold;
            color:#1598c9;
        }

        .logo span{
            color:#17324d;
        }

        .nav-links{
            display:flex;
            gap:25px;
            align-items:center;
            list-style:none;
        }

        .nav-links a{
            text-decoration:none;
            color:#17324d;
            font-weight:600;
        }

        .nav-links a:hover{
            color:#1598c9;
        }

        /* LOGIN */

        .login-container{
            min-height:calc(100vh - 75px);
            display:flex;
            justify-content:center;
            align-items:center;
            padding:40px 20px;
        }

        .login-box{
            width:100%;
            max-width:450px;
            background:white;
            padding:42px;
            border-radius:22px;
            box-shadow:0 12px 40px rgba(0,0,0,0.10);
        }

        .login-icon{
            text-align:center;
            font-size:50px;
            margin-bottom:10px;
        }

        .login-box h1{
            text-align:center;
            color:#1598c9;
            font-size:32px;
            margin-bottom:8px;
        }

        .subtitle{
            text-align:center;
            color:#667788;
            margin-bottom:30px;
            line-height:1.5;
        }

        .form-group{
            margin-bottom:20px;
        }

        .form-group label{
            display:block;
            margin-bottom:7px;
            font-weight:bold;
        }

        .form-group input{
            width:100%;
            padding:14px;
            border:1px solid #cbdde7;
            border-radius:10px;
            font-size:15px;
            outline:none;
        }

        .form-group input:focus{
            border-color:#1598c9;
            box-shadow:0 0 0 3px rgba(21,152,201,0.10);
        }

        .login-btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#1598c9;
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
        }

        .login-btn:hover{
            background:#087da9;
        }

        .message{
            text-align:center;
            margin-top:18px;
            font-weight:bold;
            min-height:20px;
        }

        .register-link{
            text-align:center;
            margin-top:25px;
            color:#667788;
        }

        .register-link a{
            color:#1598c9;
            font-weight:bold;
            text-decoration:none;
        }

        .register-link a:hover{
            text-decoration:underline;
        }

        @media(max-width:800px){

            .navbar{
                flex-direction:column;
                gap:15px;
            }

            .nav-links{
                flex-wrap:wrap;
                justify-content:center;
                gap:15px;
            }

        }

    </style>

</head>

<body>


<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        Medi<span>Quick</span> Pharmacy
    </div>

    <ul class="nav-links">

        <li>
            <a href="login.html">
                Login
            </a>
        </li>

        <li>
            <a href="register.html">
                Register
            </a>
        </li>

    </ul>

</nav>


<!-- LOGIN -->

<div class="login-container">

    <div class="login-box">

        <div class="login-icon">
            🩺
        </div>

        <h1>
            Welcome Back!
        </h1>

        <p class="subtitle">
            Please login to continue to
            MediQuick Pharmacy
        </p>


        <form id="loginForm">

            <div class="form-group">

                <label for="loginUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Enter your username"
                    required>

            </div>


            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required>

            </div>


            <button
                type="submit"
                class="login-btn">

                Login

            </button>

        </form>


        <div
            id="loginMessage"
            class="message">
        </div>


        <div class="register-link">

            Don't have an account?

            <a href="register.html">
                Create an account
            </a>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>

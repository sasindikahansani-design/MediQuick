 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop | MediQuick</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3fbff;
            color: #234755;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            width: 100%;
            height: 90px;
            background: white;
            border-bottom: 1px solid #d9edf4;

            display: flex;
            align-items: center;
        }

        .nav-container {
            width: 88%;
            max-width: 1400px;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
        }

        .logo a {
            text-decoration: none;
            color: #073b5c;
            font-size: 31px;
            font-weight: 800;
            white-space: nowrap;
        }

        .logo-plus {
            color: #0785ad;
            font-size: 36px;
            margin-right: 8px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #36586a;
            font-size: 17px;
            font-weight: 600;
            white-space: nowrap;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #0785ad;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-right a {
            text-decoration: none;
            color: #36586a;
            font-size: 17px;
            font-weight: 600;
        }

        .cart-btn {
            background: #eaf8fc;
            padding: 12px 17px;
            border-radius: 30px;
        }

        /* ================= HERO ================= */

        .hero {
            padding: 55px 20px 40px;
            text-align: center;

            background:
                linear-gradient(135deg, #e8f9ff, #ffffff);
        }

        .hero h1 {
            color: #073b5c;
            font-size: 44px;
            margin-bottom: 12px;
        }

        .hero p {
            color: #607b87;
            font-size: 17px;
        }

        /* ================= SHOP ================= */

        .shop-container {
            width: 88%;
            max-width: 1300px;
            margin: 40px auto 80px;
        }

        /* ================= FILTER ================= */

        .shop-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 15px 18px;

            border: 1px solid #cfe5ed;
            border-radius: 12px;

            font-size: 16px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #0785ad;
        }

        .category-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .category-btn {
            border: 1px solid #bcdce7;
            background: white;
            color: #36586a;

            padding: 12px 18px;

            border-radius: 25px;

            cursor: pointer;

            font-weight: 600;
        }

        .category-btn:hover,
        .category-btn.active {
            background: #0785ad;
            color: white;
            border-color: #0785ad;
        }

        /* ================= PRODUCTS ================= */

        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .product-card {
            background: white;

            border: 1px solid #d7eaf1;
            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 10px 28px rgba(0, 100, 140, 0.08);

            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-6px);

            box-shadow:
                0 16px 35px rgba(0, 100, 140, 0.14);
        }

        .product-image {
            width: 100%;
            height: 230px;
            overflow: hidden;
            background: #e8f8fc;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .product-info {
            padding: 22px;
        }

        .product-category {
            display: inline-block;

            color: #0785ad;
            background: #eaf8fc;

            padding: 6px 10px;

            border-radius: 20px;

            font-size: 12px;
            font-weight: bold;

            margin-bottom: 10px;
        }

        .product-info h3 {
            color: #073b5c;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .product-info p {
            color: #71828b;
            font-size: 14px;
            line-height: 1.5;
            min-height: 42px;
        }

        .product-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-top: 18px;
        }

        .price {
            color: #0785ad;
            font-size: 20px;
            font-weight: bold;
        }

        .add-btn {
            border: none;

            background: #0785ad;
            color: white;

            padding: 11px 15px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: bold;
        }

        .add-btn:hover {
            background: #056b89;
        }

        /* ================= CART ================= */

        .cart-section {
            margin-top: 60px;

            background: white;

            border: 1px solid #d7eaf1;
            border-radius: 20px;

            padding: 30px;

            box-shadow:
                0 10px 28px rgba(0, 100, 140, 0.08);
        }

        .cart-section h2 {
            color: #073b5c;
            margin-bottom: 20px;
        }

        #cartItems {
            margin-bottom: 20px;
        }

        .empty-cart {
            color: #71828b;
            padding: 15px 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 15px 0;

            border-bottom: 1px solid #edf4f7;
        }

        .cart-item-name {
            color: #073b5c;
            font-weight: bold;
        }

        .cart-item-price {
            color: #0785ad;
            font-weight: bold;
        }

        .remove-btn {
            border: none;
            background: #ffeaea;
            color: #b42318;

            padding: 7px 12px;

            border-radius: 7px;

            cursor: pointer;
        }

        .cart-total {
            text-align: right;

            color: #073b5c;

            font-size: 22px;
            font-weight: bold;
        }

        /* ================= NO PRODUCTS ================= */

        .no-products {
            grid-column: 1 / -1;

            text-align: center;

            padding: 60px;

            background: white;

            border-radius: 18px;

            color: #71828b;
        }

        /* ================= FOOTER ================= */

        footer {
            background: #073b5c;
            color: white;
            text-align: center;
            padding: 25px;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 1100px) {

            .products-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .nav-links {
                gap: 15px;
            }

            .nav-links a,
            .nav-right a {
                font-size: 14px;
            }

            .logo a {
                font-size: 26px;
            }
        }

        @media (max-width: 800px) {

            .navbar {
                height: auto;
                padding: 18px 0;
            }

            .nav-container {
                flex-wrap: wrap;
                justify-content: center;
            }

            .nav-links {
                order: 3;
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }

            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {

            .products-grid {
                grid-template-columns: 1fr;
            }

            .shop-container {
                width: 92%;
            }

            .hero h1 {
                font-size: 34px;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <div class="nav-container">

        <div class="logo">

            <a href="index.html">

                <span class="logo-plus">+</span>
                MediQuick

            </a>

        </div>


        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="shop.html" class="active">
                    Shop
                </a>
            </li>

            <li>
                <a href="about.html">
                    About Us
                </a>
            </li>

            <li>
                <a href="prescription.html">
                    Prescriptions
                </a>
            </li>

            <li>
                <a href="consult.html">
                    Consult Doctor
                </a>
            </li>

            <li>
                <a href="offers.html">
                    Offers
                </a>
            </li>

        </ul>


        <div class="nav-right">

            <a href="#cart" class="cart-btn">
                🛒
                <span id="cartCount">0</span>
            </a>

            <a href="login.html">
                Login
            </a>

            <a href="register.html">
                Register
            </a>

        </div>

    </div>

</header>


<!-- ================= HERO ================= -->

<section class="hero">

    <h1>
        Our Healthcare Shop
    </h1>

    <p>
        Quality healthcare products at convenient prices
    </p>

</section>


<!-- ================= SHOP ================= -->

<main class="shop-container">


    <!-- SEARCH + FILTER -->

    <div class="shop-tools">

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search medicines and healthcare products..."
            >

        </div>


        <div class="category-buttons">

            <button
                class="category-btn active"
                data-category="all">

                All

            </button>

            <button
                class="category-btn"
                data-category="otc">

                OTC

            </button>

            <button
                class="category-btn"
                data-category="prescription">

                Prescription

            </button>

            <button
                class="category-btn"
                data-category="wellness">

                Wellness

            </button>

            <button
                class="category-btn"
                data-category="personal">

                Personal Care

            </button>

        </div>

    </div>


    <!-- PRODUCTS -->

    <div
        class="products-grid"
        id="productsGrid">

    </div>


    <!-- ================= CART ================= -->

    <section
        class="cart-section"
        id="cart">

        <h2>
            🛒 Your Shopping Cart
        </h2>


        <div id="cartItems">

            <p class="empty-cart">
                Your cart is empty.
            </p>

        </div>


        <div
            class="cart-total"
            id="cartTotal">

            Total: Rs. 0

        </div>

    </section>

</main>


<!-- ================= FOOTER ================= -->

<footer>

    <p>
        © 2026 MediQuick Pharmacy. All Rights Reserved.
    </p>

</footer>


<script>

    /* =================================================
       PRODUCTS
    ================================================= */

    const products = [

        {
            id: 1,
            name: "Paracetamol 500mg",
            category: "otc",
            categoryName: "OTC",
            price: 450,
            description: "Common pain and fever relief medicine.",
            image: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=900&q=85"
        },

        {
            id: 2,
            name: "Vitamin C Tablets",
            category: "wellness",
            categoryName: "Wellness",
            price: 1250,
            description: "Vitamin C supplement for everyday wellness.",
            image: "https://images.unsplash.com/photo-1616671276441-2f2c8c4b8c8b?auto=format&fit=crop&w=900&q=85"
        },

        {
            id: 3,
            name: "Blood Pressure Care",
            category: "prescription",
            categoryName: "Prescription",
            price: 1850,
            description: "Healthcare product for blood pressure management.",
            image: "https://images.unsplash.com/photo-1471864190281-a93a3070b6de?auto=format&fit=crop&w=900&q=85"
        },

        {
            id: 4,
            name: "Daily Skin Care Kit",
            category: "personal",
            categoryName: "Personal Care",
            price: 2200,
            description: "Essential products for everyday skin care.",
            image: "https://images.unsplash.com/photo-1556229010-6c3f2c9ca5f8?auto=format&fit=crop&w=900&q=85"
        },

        {
            id: 5,
            name: "Omega 3 Capsules",
            category: "wellness",
            categoryName: "Wellness",
            price: 1650,
            description: "Omega 3 nutritional supplement.",
            image: "https://images.unsplash.com/photo-1608571423902-eed4a5ad8108?auto=format&fit=crop&w=900&q=85"
        },

        {
            id: 6,
            name: "Digital Thermometer",
            category: "otc",
            categoryName: "OTC",
            price: 980,
            description: "Easy-to-use digital temperature monitor.",
            image: "https://images.unsplash.com/photo-1584036561566-baf8f5f1b144?auto=format&fit=crop&w=900&q=85"
        },

        {
            id: 7,
            name: "Moisturising Lotion",
            category: "personal",
            categoryName: "Personal Care",
            price: 1450,
            description: "Daily moisturising lotion for skin care.",
            image: "https://images.unsplash.com/photo-1611930022073-b7a4ba5fcccd?auto=format&fit=crop&w=900&q=85"
        },

        {
            id: 8,
            name: "Allergy Relief",
            category: "prescription",
            categoryName: "Prescription",
            price: 1750,
            description: "Healthcare product for allergy management.",
            image: "https://images.unsplash.com/photo-1587854692152-cbe660dbde88?auto=format&fit=crop&w=900&q=85"
        }

    ];


    /* =================================================
       CART
    ================================================= */

    let cart =
        JSON.parse(
            localStorage.getItem("mediquickCart")
        ) || [];


    /* =================================================
       RENDER PRODUCTS
    ================================================= */

    function renderProducts(
        category = "all",
        search = ""
    ) {

        const grid =
            document.getElementById(
                "productsGrid"
            );


        const filteredProducts =
            products.filter(function(product) {

                const categoryMatch =
                    category === "all" ||
                    product.category === category;


                const searchMatch =
                    product.name
                        .toLowerCase()
                        .includes(
                            search.toLowerCase()
                        );


                return (
                    categoryMatch &&
                    searchMatch
                );

            });


        grid.innerHTML = "";


        if (
            filteredProducts.length === 0
        ) {

            grid.innerHTML = `

                <div class="no-products">

                    <h2>
                        No products found
                    </h2>

                    <p>
                        Try another search or category.
                    </p>

                </div>

            `;

            return;

        }


        filteredProducts.forEach(
            function(product) {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "product-card";


                card.innerHTML = `

                    <div class="product-image">

                        <img
                            src="${product.image}"
                            alt="${product.name}"
                            onerror="productImageFallback(this, '${product.name}')"
                        >

                    </div>


                    <div class="product-info">

                        <span class="product-category">

                            ${product.categoryName}

                        </span>


                        <h3>
                            ${product.name}
                        </h3>


                        <p>
                            ${product.description}
                        </p>


                        <div class="product-bottom">

                            <span class="price">

                                Rs. ${product.price.toLocaleString()}

                            </span>


                            <button
                                class="add-btn"
                                onclick="addToCart(${product.id})">

                                Add to Cart

                            </button>

                        </div>

                    </div>

                `;


                grid.appendChild(card);

            }
        );

    }


    /* =================================================
       IMAGE FALLBACK
    ================================================= */

    function productImageFallback(
        image,
        title
    ) {

        image.onerror = null;


        const svg = `

            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="900"
                height="650">

                <defs>

                    <linearGradient
                        id="bg"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1">

                        <stop
                            offset="0%"
                            stop-color="#e7f9ff"/>

                        <stop
                            offset="100%"
                            stop-color="#b7e8f4"/>

                    </linearGradient>

                </defs>


                <rect
                    width="900"
                    height="650"
                    fill="url(#bg)"
                />


                <circle
                    cx="450"
                    cy="260"
                    r="130"
                    fill="white"
                />


                <text
                    x="450"
                    y="305"
                    text-anchor="middle"
                    font-size="105">

                    💊

                </text>


                <text
                    x="450"
                    y="465"
                    text-anchor="middle"
                    font-family="Arial"
                    font-size="34"
                    font-weight="bold"
                    fill="#073b5c">

                    ${title}

                </text>


                <text
                    x="450"
                    y="510"
                    text-anchor="middle"
                    font-family="Arial"
                    font-size="22"
                    fill="#52707c">

                    MediQuick Pharmacy

                </text>

            </svg>

        `;


        image.src =
            "data:image/svg+xml;charset=UTF-8," +
            encodeURIComponent(svg);

    }


    /* =================================================
       ADD TO CART
    ================================================= */

    function addToCart(productId) {

        const product =
            products.find(
                function(item) {

                    return item.id === productId;

                }
            );


        if (!product) {
            return;
        }


        const existing =
            cart.find(
                function(item) {

                    return item.id === productId;

                }
            );


        if (existing) {

            existing.quantity++;

        } else {

            cart.push({

                id: product.id,
                name: product.name,
                price: product.price,
                quantity: 1

            });

        }


        saveCart();


        alert(
            product.name +
            " added to your cart."
        );

    }


    /* =================================================
       REMOVE CART ITEM
    ================================================= */

    function removeFromCart(productId) {

        cart =
            cart.filter(
                function(item) {

                    return item.id !== productId;

                }
            );


        saveCart();

    }


    /* =================================================
       DISPLAY CART
    ================================================= */

    function displayCart() {

        const cartItems =
            document.getElementById(
                "cartItems"
            );


        const cartTotal =
            document.getElementById(
                "cartTotal"
            );


        if (cart.length === 0) {

            cartItems.innerHTML = `

                <p class="empty-cart">

                    Your cart is empty.

                </p>

            `;

            cartTotal.textContent =
                "Total: Rs. 0";

            return;

        }


        cartItems.innerHTML = "";


        let total = 0;


        cart.forEach(
            function(item) {

                total +=
                    item.price *
                    item.quantity;


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "cart-item";


                div.innerHTML = `

                    <div>

                        <span class="cart-item-name">

                            ${item.name}

                        </span>

                        <br>

                        <small>

                            Quantity:
                            ${item.quantity}

                        </small>

                    </div>


                    <span class="cart-item-price">

                        Rs.
                        ${(item.price * item.quantity).toLocaleString()}

                    </span>


                    <button
                        class="remove-btn"
                        onclick="removeFromCart(${item.id})">

                        Remove

                    </button>

                `;


                cartItems.appendChild(div);

            }
        );


        cartTotal.textContent =
            "Total: Rs. " +
            total.toLocaleString();

    }


    /* =================================================
       SAVE CART
    ================================================= */

    function saveCart() {

        localStorage.setItem(
            "mediquickCart",
            JSON.stringify(cart)
        );


        updateCartCount();


        displayCart();

    }


    /* =================================================
       CART COUNT
    ================================================= */

    function updateCartCount() {

        const count =
            document.getElementById(
                "cartCount"
            );


        let total = 0;


        cart.forEach(
            function(item) {

                total +=
                    item.quantity;

            }
        );


        count.textContent =
            total;

    }


    /* =================================================
       CATEGORY FILTER
    ================================================= */

    let selectedCategory = "all";


    document
        .querySelectorAll(".category-btn")
        .forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function() {

                        document
                            .querySelectorAll(
                                ".category-btn"
                            )
                            .forEach(
                                function(btn) {

                                    btn.classList.remove(
                                        "active"
                                    );

                                }
                            );


                        this.classList.add(
                            "active"
                        );


                        selectedCategory =
                            this.dataset.category;


                        const search =
                            document
                                .getElementById(
                                    "searchInput"
                                )
                                .value;


                        renderProducts(
                            selectedCategory,
                            search
                        );

                    }
                );

            }
        );


    /* =================================================
       SEARCH
    ================================================= */

    document
        .getElementById("searchInput")
        .addEventListener(
            "input",
            function() {

                renderProducts(
                    selectedCategory,
                    this.value
                );

            }
        );


    /* =================================================
       START PAGE
    ================================================= */

    renderProducts();

    updateCartCount();

    displayCart();

</script>

</body>

</html>
